<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings — Natural Language Page Search</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1a1a2e;
      background: #f8f9fc;
      padding: 20px;
    }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #444; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid #d1d5e0;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #5c6bc0; box-shadow: 0 0 0 3px rgba(92,107,192,0.12); }
    .field { margin-bottom: 16px; }
    .hint { font-size: 11px; color: #888; margin-top: 4px; }
    .btn {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: #5c6bc0;
      color: #fff;
      transition: background 0.15s;
    }
    .btn:hover { background: #4a58a8; }
    .status { margin-top: 12px; font-size: 13px; color: #16a34a; display: none; }
    select {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid #d1d5e0;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: #fff;
    }
  </style>
</head>
<body>
  <h2>Settings</h2>
  <div class="field">
    <label for="api-key">Gemini API Key</label>
    <input type="password" id="api-key" placeholder="AIza...">
    <div class="hint">Get a key at <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a></div>
  </div>
  <div class="field">
    <label for="model-select">Model</label>
    <select id="model-select">
      <option value="gemini-2.0-flash">Gemini 2.0 Flash (fast, recommended)</option>
      <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite (fastest)</option>
      <option value="gemini-1.5-pro">Gemini 1.5 Pro (most capable)</option>
    </select>
  </div>
  <button class="btn" id="save-btn">Save</button>
  <div class="status" id="status">Saved!</div>

  <script src="options.js"></script>
</body>
</html>
